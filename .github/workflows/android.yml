name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # gh release create

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Пакеты платформы и build-tools заданы явно, чтобы не зависеть от авто-докачки AGP.
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0'

      # Кэш восстанавливается до setup-gradle, чтобы дистрибутив Gradle не качался заново.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # В репозитории нет gradle/wrapper/ (и gradle-wrapper.jar): gradlew — тонкая
      # обёртка над локальной установкой Gradle в ~/.gradle/wrapper/dists, в CI её нет.
      # Поэтому ставим Gradle 8.11.1 и вызываем `gradle`.
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          cache-disabled: true # кэш выше, через actions/cache@v4

      - name: chmod gradlew
        run: chmod +x gradlew

      # Секреты не печатаются: base64 декодируется в файл, keystore.properties пишется из секрета.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PROPERTIES:-}" ]; then
            echo "подпись недоступна, собираю debug"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # storeFile из keystore.properties резолвится относительно каталога модуля (:app).
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore.properties
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            gradle :app:assembleRelease :app:testDebugUnitTest --no-daemon
          else
            gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          gh release create "$TAG" "${apks[@]}" --title "$TAG" --notes "сборка CI" \
            || gh release upload "$TAG" "${apks[@]}" --clobber